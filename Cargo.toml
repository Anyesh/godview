[package]
name = "godview"
version = "0.1.0"
edition = "2024"
description = "A herdr pane showing every agent and its subagents in one live tree."
license = "MIT"
repository = "https://github.com/Anyesh/godview"

[dependencies]
anyhow = "1"
notify = { version = "8", default-features = false }
ratatui = "0.29"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
